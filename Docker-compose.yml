services:
  task-manager-backend:
    container_name: task-manager-backend
    build:
      context: ./
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      task-manager-backend-db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - task-manager-network

  task-manager-backend-db:
    container_name: task-manager-backend-db
    image: postgres:17-alpine
    ports:
      - "5555:5432"
    environment:
      POSTGRES_DB: task-manager-backend-db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 267115
    healthcheck:
      test: [ "CMD-SHELL", "sh -c 'pg_isready -U postgres -d task-manager-backend-db'" ]
      interval: 1s
      timeout: 5s
      retries: 10
    volumes:
      - task-manager-backend-db:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - task-manager-network



  keycloak:
    container_name: keycloak
    image: quay.io/keycloak/keycloak:24.0
    command: start-dev
    ports:
      - "8180:8080"
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    restart: unless-stopped
    networks:
      - task-manager-network

volumes:
  task-manager-backend-db:

networks:
  task-manager-network:
    driver: bridge
